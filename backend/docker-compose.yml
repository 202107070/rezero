services:
  game-server:
    build:
      context: ..
      dockerfile: backend/src/infra/docker/gameroom/game.Dockerfile
    container_name: game-room
    restart: always
    env_file:
      - .env
    environment:
      # compose 네트워크 안에서는 서비스 이름을 호스트로 사용합니다.
      PORT: "3000"
      REDIS_HOST: redis
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: game_user
      DB_PASSWORD: user_password_5678
      DB_NAME: rezero_game
    ports:
      - "3000:3000"
    volumes:
      - ..:/app
      - /app/node_modules
      - /app/backend/node_modules
      - ./src/infra/mountpoint/sandbox:/app/backend/src/infra/mountpoint/sandbox:z
      - ./src/infra/mountpoint/resultbox:/app/backend/src/infra/mountpoint/resultbox:z
    depends_on:
      - db
      - redis
    extra_hosts:
      - "host.containers.internal:host-gateway"
      - "host.docker.internal:host-gateway"

  code-runner:
    build:
      context: .
      dockerfile: ./src/infra/docker/buildsystem/build.Dockerfile
    container_name: build-runner
    restart: always
    volumes:
      - ./src/infra/mountpoint/sandbox:/app/sandbox:z
      - ./src/infra/mountpoint/resultbox:/app/resultbox:z
    tty: true
    stdin_open: true

  db:
    image: docker.io/library/mariadb:10.11
    container_name: game-db
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: "root_password_1234"
      MARIADB_DATABASE: "rezero_game"
      MARIADB_USER: "game_user"
      MARIADB_PASSWORD: "user_password_5678"
    ports:
      - "3306:3306"
    volumes:
      - ./src/infra/mountpoint/dbbox:/var/lib/mysql:z
      - ./src/infra/docker/gameroom/init.sql:/docker-entrypoint-initdb.d/init.sql:z

  # Valkey(Redis 호환). backend/.env 의 REDIS_PORT 를 사용합니다.
  redis:
    image: docker.io/valkey/valkey:8.1-alpine
    container_name: game-redis
    restart: always
    env_file:
      - .env
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - ./src/infra/mountpoint/redisbox:/data:z
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
